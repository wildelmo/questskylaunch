name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the OIDC token Pages deployment needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and never cancel one that is already
# publishing — a half-uploaded artifact is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Physics sanity checks
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the bundle came out whole
        # Everything is procedural, so the bundle is just the page and its
        # JavaScript — but a build that silently dropped the JS would still
        # deploy and show a black screen.
        run: |
          set -eu
          test -s dist/index.html || { echo "missing dist/index.html"; exit 1; }
          ls dist/assets/*.js >/dev/null 2>&1 || { echo "no JS bundle in dist/assets"; exit 1; }
          echo "bundle: $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
